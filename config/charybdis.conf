CONFIG_ZMK_KEYBOARD_NAME="Charybdis"

# Bluetooth Security - passkey entry disabled
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# Transmit power / connection stability
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Connection interval / latency tuning
# Min/Max define the acceptable range for sync frequency - tighter range
# helps prevent trackball data from overflowing the connection buffer
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=2

# Bluetooth buffer sizes - important for trackball's high HID report rate
# Note: EVT_RX_COUNT must be greater than ACL_TX_COUNT (Zephyr build requirement)
CONFIG_BT_BUF_ACL_TX_COUNT=24
CONFIG_BT_BUF_EVT_RX_COUNT=25
CONFIG_BT_L2CAP_TX_BUF_COUNT=32

# Behavior queue size (macros/combos headroom)
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

# Battery level reporting for both halves
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# External power control (underglow, etc.)
CONFIG_ZMK_EXT_POWER=y
